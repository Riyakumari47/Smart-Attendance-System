<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Attendance System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body class="login-page">

    <div class="login-background">
        <div class="login-orb orb-one"></div>
        <div class="login-orb orb-two"></div>
        <div class="login-grid"></div>
    </div>

    <main class="login-container">

        <section class="login-brand">
            <div class="login-logo">
                <span>◉</span>
            </div>

            <h1>Smart Attendance</h1>
            <p>Face Recognition Attendance System</p>

            <div class="system-status">
                <span class="status-dot"></span>
                System Online
            </div>
        </section>

        <section class="login-card">

            <div class="login-card-header">
                <div class="login-icon">
                    🔐
                </div>

                <h2>Welcome Back</h2>
                <p>Sign in to access your attendance dashboard</p>
            </div>

            {% if error %}
            <div class="login-error">
                <span>⚠</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="login-field">
                    <label for="username">Username</label>

                    <div class="login-input">
                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>

                    <div class="login-input">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            ◉
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <span>Sign In</span>
                    <span class="login-arrow">→</span>
                </button>

            </form>

            <div class="login-footer">
                <span class="footer-line"></span>
                <span>SECURE ADMIN ACCESS</span>
                <span class="footer-line"></span>
            </div>

        </section>

        <p class="login-copyright">
            © 2026 Smart Attendance System
        </p>

    </main>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".password-toggle");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "◉";
            } else {
                password.type = "password";
                button.textContent = "◉";
            }
        }
    </script>

</body>
</html>
